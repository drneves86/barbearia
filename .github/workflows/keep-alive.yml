name: Keep Render alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to prevent Render from spinning down
        run: |
          curl -fsS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" \
            --max-time 60 \
            "https://barbearia-qosa.onrender.com/api/health"
