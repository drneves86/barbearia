name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render para evitar sleep (15 min) e Supabase (7 dias)
        run: |
          curl -sS -o /dev/null --max-time 90 "https://barbearia-qosa.onrender.com/api/catalog" || echo "ping falhou (ignorado)"
