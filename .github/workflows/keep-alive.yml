name: Keep Render alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to prevent Render from spinning down
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS -o /dev/null -w "attempt=$i status=%{http_code} time=%{time_total}s\n" \
              --max-time 60 \
              "https://barbearia-qosa.onrender.com/api/health"; then
              exit 0
            fi
            sleep 45
          done
          echo "keep-alive falhou apos 6 tentativas" >&2
          exit 1
